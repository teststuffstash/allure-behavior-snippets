[tool.poetry]
name = "allure-behavior-snippets"
version = "0.6.3"
description = "Allure evidence tools + the portable spec/evidence/review process (rules, conventions, reviewer briefs, context pack)"
authors = ["Your Name <you@example.com>"]
license = "Apache License"
readme = "README.md"
packages = [{ include = "allure_behavior_snippets" }]
include = [{ path = "allure_behavior_snippets/process/**/*.md", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
python = "^3.11"
svgwrite = ">=1.4.3"


[tool.poetry.group.dev.dependencies]
pytest-playwright = "^0.10.0"
# Exact pin: must match the mcr.microsoft.com/playwright/python image tag
# in tests/Dockerfile — browsers are baked into that image per version.
playwright = "1.61.0"
pytest-playwright-snapshot = "^1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
allure-behavior-snippets = "allure_behavior_snippets.main:cli"
allure-evidence = "allure_behavior_snippets.evidence:cli"
touched-rules = "allure_behavior_snippets.touched_rules:main"
evidence-pack = "allure_behavior_snippets.pack:main"
process-path = "allure_behavior_snippets.pack:process_path_main"
